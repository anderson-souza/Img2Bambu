[project]
name = "img2bambu"
version = "0.1.0"
description = "Imagem PNG -> projeto 3MF multicor (base + relevo) para Bambu Studio"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs Bambu Studio installed (slices via CLI)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]
